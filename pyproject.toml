# Test configuration only. This repo is a scaffold, not a distributable package,
# so there is no [build-system] or [project] table.

[project]
name = "atr-plasticity"
version = "0.0.0"
# zip(..., strict=True) is used in the EXP-003 analysis and raises TypeError on 3.9.
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

# plasticity.py and controls.py sit at the repo root and are not installed as a
# package. `python -m pytest` happens to work because it puts the CWD on
# sys.path; the `pytest` console script does not, so a bare `pytest` -- which is
# what CI and the session-start hook both tell you to run -- fails collection
# with ModuleNotFoundError. Making the path explicit fixes every invocation
# rather than the one that accidentally worked.
pythonpath = ["."]

# No marker selection. There is no fast/slow split any more: every test runs
# against real GPT-2 small, so a bare `pytest` is the whole suite. --strict-markers
# and --strict-config keep a typo'd marker or config key an error rather than a
# silently skipped test.
addopts = "-q --strict-markers --strict-config"
