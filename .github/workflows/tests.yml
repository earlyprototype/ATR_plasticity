name: Tests

# The pytest suite. Unrelated to the four board workflows in this directory.
#
# One job, because there is no fast/slow split any more: the toy model is gone
# and every test runs against real GPT-2 small. That means the checkpoint is a
# hard dependency of the suite rather than an optional extra, so it is cached
# here and the run is told to fail if it is missing.
#
# CPU-only torch from the pytorch wheel index — the runner has no GPU and the
# CUDA wheels are ~2GB.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    # A cold checkpoint download behind a stalled network would otherwise sit on
    # the 6-hour default.
    timeout-minutes: 30

    steps:
      # No credentials in .git/config: this job pushes nothing and runs pip
      # installs, so there is no reason to leave a token behind it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache the HuggingFace checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # ATR_REQUIRE_MODEL turns "GPT-2 unavailable" from a skip into a failure.
      # Without it, a runner missing transformers or the checkpoint skips the
      # whole suite and still exits 0 — measured at 84 of 91 tests skipped, job
      # green. A check that cannot fail is worse than no check.
      - name: Run tests
        env:
          ATR_REQUIRE_MODEL: '1'
        run: pytest
