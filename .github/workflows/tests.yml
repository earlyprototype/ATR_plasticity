name: Tests

# The pytest suite. Unrelated to the four board workflows in this directory.
#
# CPU-only torch from the pytorch wheel index — the CI runner has no GPU and the
# CUDA wheels are ~2GB. The default pytest run excludes the `slow` marker, so
# nothing here downloads a HuggingFace model.

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
