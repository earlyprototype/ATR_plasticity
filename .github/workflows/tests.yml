name: Tests

# The pytest suite. Unrelated to the four board workflows in this directory.
#
# CPU-only torch from the pytorch wheel index — the CI runner has no GPU and the
# CUDA wheels are ~2GB. The default pytest run excludes the `slow` marker, so
# nothing here downloads a HuggingFace model.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  # The GPT-2 small suite. Manual only: it installs transformers and pulls a
  # ~500MB checkpoint, which is not worth doing on every push. Run it before
  # trusting a change to the hook or the write-back path, since that is where
  # the toy model and the real Conv1D could disagree.
  slow:
    name: tests (gpt2-small)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache the HuggingFace checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt -r requirements.txt

      - name: Run the slow tests
        run: pytest -m slow
