name: Tests

# The pytest suite. Unrelated to the four board workflows in this directory.
#
# One job, because there is no fast/slow split any more: the toy model is gone
# and every test runs against real GPT-2 small. That means the checkpoint is a
# hard dependency of the suite rather than an optional extra, so it is cached
# here and the run is told to fail if it is missing.
#
# CPU-only torch from the pytorch wheel index — the runner has no GPU and the
# CUDA wheels are ~2GB.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    # A cold checkpoint download behind a stalled network would otherwise sit on
    # the 6-hour default.
    timeout-minutes: 30

    steps:
      # No credentials in .git/config: this job pushes nothing and runs pip
      # installs, so there is no reason to leave a token behind it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The parent ATR project, for the bridge's acceptance test: iterating our
      # per-step engine must reproduce atr_engine.run_atr_loop bit-exactly.
      # Without this checkout that test skips, and the single guarantee that
      # atr_bridge.py is an extraction rather than a second ATR implementation
      # would hold only on the author's machine. Measured: 4 skipped, job green.
      - uses: actions/checkout@v4
        with:
          repository: earlyprototype/lucier-gpt2-activ-tensor-reson-experiments
          path: .parent-atr
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache the HuggingFace checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # Both REQUIRE flags turn "the thing under test is unavailable" from a
      # skip into a failure. Without ATR_REQUIRE_MODEL, a runner missing
      # transformers or the checkpoint skips the whole suite and still exits 0
      # — 227 tests, essentially all skipped, job green. Without ATR_REQUIRE_PARENT,
      # the bit-exactness acceptance test skips the same way. A check that
      # cannot fail is worse than no check.
      - name: Run tests
        env:
          ATR_REQUIRE_MODEL: '1'
          ATR_REQUIRE_PARENT: '1'
          ATR_PARENT_PATH: ${{ github.workspace }}/.parent-atr
        run: pytest
